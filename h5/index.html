<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#060b14">
<title>OceanBus Console</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Sidebar backdrop (mobile) -->
<div class="sidebar-backdrop" id="sidebar-backdrop" onclick="closeSidebar()"></div>

<!-- Sidebar -->
<aside class="sidebar open" id="sidebar">
  <div class="sidebar-header">
    <div class="logo">📡</div>
    <span>OceanBus</span>
    <span class="dot dot-green" id="conn-dot"></span>
  </div>

  <div class="section">
    <div class="section-title">已绑定 Agent</div>
    <div id="agent-list"><div class="note">暂无</div></div>
    <button class="btn btn-outline btn-sm btn-full" style="margin-top:8px" onclick="startPairing()">+ 绑定 Agent</button>
  </div>

  <div class="section">
    <div class="section-title">活跃窗口</div>
    <div id="window-list"><div class="note">暂无窗口</div></div>
  </div>
</aside>

<!-- Main -->
<main class="main">
  <header class="main-header" id="main-header">
    <button class="menu-btn" onclick="toggleSidebar()" title="菜单">☰</button>
    <span style="font-size:22px">📡</span>
    <div>
      <div class="title">OceanBus Console</div>
      <div class="meta">选择一个窗口开始对话</div>
    </div>
  </header>

  <div id="msg-container">
    <div class="placeholder">点击左侧窗口开始对话</div>
  </div>

  <div class="input-bar hidden" id="input-bar">
    <input id="msg-input" placeholder="输入消息..." autofocus>
    <button onclick="sendMsg()">发送</button>
  </div>
</main>

<!-- Pairing Modal -->
<div class="modal-overlay hidden" id="pairing-modal">
  <div class="modal">
    <h3>绑定 Agent</h3>
    <p class="info">在 CC 终端复制运行：</p>
    <div class="cmd" id="pairing-cmd">加载中...</div>
    <button class="btn btn-primary btn-sm" onclick="copyCmd()">复制命令</button>
    <p class="info" style="margin-top:10px">粘贴到 Agent 终端即可完成绑定</p>
    <button class="btn btn-outline btn-sm" style="margin-top:4px" onclick="closePairing()">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
