<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>OceanBus Console</title>
<link rel="stylesheet" href="/style.css">
</head>
<body>

<!-- Sidebar -->
<aside class="sidebar">
  <div class="sidebar-header">
    <span class="logo">📡</span>
    <span>OceanBus</span>
    <span class="dot dot-green" id="conn-dot" title="Cloud 连接"></span>
  </div>

  <div class="section">
    <div class="section-title">Agent 列表</div>
    <div id="agent-list"></div>
    <button class="btn btn-outline btn-sm" style="margin-top:6px;width:100%" onclick="startPairing()">🔗 绑定新 Agent</button>
  </div>

  <div class="section" style="flex:1;overflow-y:auto">
    <div class="section-title">活跃窗口</div>
    <div id="window-list"></div>
  </div>
</aside>

<!-- Main -->
<main class="main">
  <header class="main-header" id="main-header">
    <span style="font-size:24px">📡</span>
    <div>
      <div class="title">OceanBus Console</div>
      <div class="meta">选择一个窗口开始对话</div>
    </div>
  </header>

  <div id="msg-container">
    <div class="placeholder">👈 选择窗口或绑定 Agent</div>
  </div>

  <div class="input-bar hidden" id="input-bar">
    <input id="msg-input" placeholder="输入消息..." autofocus>
    <button onclick="sendMsg()">发送</button>
  </div>
</main>

<!-- Pairing Modal -->
<div class="modal-overlay hidden" id="pairing-modal">
  <div class="modal">
    <h3>🔗 绑定 Agent</h3>
    <p class="info">在 Agent 终端复制运行：</p>
    <div class="cmd" id="pairing-cmd">npx oceanbus start --peer ...</div>
    <button class="btn btn-primary btn-sm" onclick="copyCmd()">📋 复制命令</button>
    <p class="info" style="margin-top:12px">复制后粘贴到 CC 窗口即可</p>
    <button class="btn btn-outline btn-sm" onclick="closePairing()">关闭</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script src="/app.js"></script>
</body>
</html>
